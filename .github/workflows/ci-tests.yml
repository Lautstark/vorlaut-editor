name: Tests

# Runs only when this job actually has something to check.
#
# docs/ and README.md were in this list for a reason that decides the whole
# prose half of it: tests/test_links.py follows every relative link and anchor
# in tracked Markdown, and a link broken by a renamed file or a moved heading
# is only ever broken by a change to those files. docs/ and adr/ went with the
# talker under adr/0012, and what is left here is README.md, CLAUDE.md and the
# two files under exchange/.
#
# That argument reaches further than any one directory. test_links.py and
# test_language.py take their file list from `git ls-files`, so they check
# EVERY tracked file, wherever it sits. A directory holding tracked prose and
# missing from this list is a directory where a broken link cannot be caught -
# the job simply does not run. The rule for anything added later is: if it
# holds a tracked .md, it belongs in this list.
#
# The configuration files at the bottom are the exception to that rule and are
# listed for a weaker reason: no test reads them today. They are here so that a
# change to how this repository builds or updates itself is not the one kind of
# change that skips its own test suite.
#
# .gitmodules is in the list because moving the pin under third_party/ changes
# what device/fixtures/ says, which is what tests/unit/device_facts.test.ts
# holds src/device/layout_facts.ts against.
on:
  push:
    branches: [main]
    paths: &paths
      - index.html
      - src/**
      - e2e/**
      - tests/**
      # tools/installcheck.mjs runs ahead of both suites, so a change to it
      # changes what each of them is standing on.
      - tools/**
      - public/**
      - exchange/**
      - README.md
      - CLAUDE.md
      - .gitmodules
      - package.json
      - package-lock.json
      - tsconfig*.json
      - vite.config.ts
      - vitest.config.ts
      - playwright.config.ts
      - renovate.json5
      - .github/workflows/ci-tests.yml
      # Not a file this job reads. It is here for the sweeps: test_language.py
      # and test_links.py take their list from `git ls-files` and so read this
      # workflow too, and a file no run ever reaches is a file they cannot
      # catch anything in.
      - .github/workflows/baselines.yml
  pull_request:
    paths: *paths

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # device/fixtures/, pinned - see third_party/README.md.
          submodules: true
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - run: npm ci

      - name: The install really is what package.json pins
        # Before any suite, on its own, and it fails rather than warns. A stale
        # node_modules surfaces as a test failing elsewhere with plausible
        # numbers in it - see tools/installcheck.mjs. Distinct from the pins.js
        # step below, which asks the opposite question of the same packages:
        # this one asks whether the install matches the pin, that one whether
        # the pin has fallen behind what upstream has published.
        run: npm run preflight

      - name: Shared packages, and whether anything newer has shipped
        # Warns, never fails: being a patch behind is not a reason to block a
        # deploy that fixes something else. The pin is what stops an install
        # moving the build; this is what stops the pin going quietly stale.
        run: node node_modules/@lautstark/design/pins.js

      - name: Types
        run: npm run typecheck

      - name: Unit and frozen references
        # vitest. Imports src/ directly rather than a build of it, because a
        # frozen reference compared against compiled output has stopped
        # measuring the source it names.
        run: npm test

      - name: Cache the Playwright browser
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install the Playwright browser
        run: npx playwright install --with-deps chromium

      - name: The page, built and opened
        # The one check that runs the front end rather than reading it. This
        # repository once shipped a page that rendered nothing while every
        # other check stayed green.
        run: npm run test:e2e

      - name: The prose, and the frozen references
        # tests/run.py is the Python half: no German where English belongs, no
        # link pointing at nothing, and the three locks under tests/reference/
        # whose oracles were Python programs. Standard library only, and no
        # compiler - adr/0012 put the firmware's C++ readers and the browser
        # writers they are held against on the other side of the seam, which is
        # where tests/run.py's own C++ half stayed.
        run: python tests/run.py
