name: Deploy the board editor to GitHub Pages

# The shape is bildhaft's deploy.yml, which solved the same problem first: test,
# then build, then deploy, with pull requests tested and never published. The
# toolchain is the same shape too - Vite and TypeScript - though without React,
# because this interface is plain DOM and there is nothing here asking to be a
# component tree.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish; queue at most one more. Cancelling a deploy half
# way leaves Pages serving whatever it had got to.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Nothing reaches Pages unless this passes. Two toolchains: vitest and
  # Playwright on the JavaScript side, and Python for the prose checks and the
  # frozen references whose oracles were Python programs. The C++ third one
  # went with the firmware - adr/0012.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # device/fixtures/, pinned. tests/unit/device_facts.test.ts and
          # tests/unit/device_package_writer.test.ts read it, and they say so
          # rather than failing on a missing file if it is not here.
          submodules: true
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - run: npm ci

      - name: The install really is what package.json pins
        # Before any suite, on its own, and it fails rather than warns. A stale
        # node_modules surfaces as a test failing elsewhere with plausible
        # numbers in it - see tools/installcheck.mjs. Distinct from the pins.js
        # step below, which asks the opposite question of the same packages:
        # this one asks whether the install matches the pin, that one whether
        # the pin has fallen behind what upstream has published.
        run: npm run preflight

      - name: Shared packages, and whether anything newer has shipped
        # Warns, never fails: being a patch behind is not a reason to block a
        # deploy that fixes something else. The pin is what stops an install
        # moving the build; this is what stops the pin going quietly stale.
        run: node node_modules/@lautstark/design/pins.js

      - name: Types
        run: npm run typecheck

      - name: Unit and frozen references
        run: npm test

      - name: Cache the Playwright browser
        id: browser
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install the Playwright browser
        run: npx playwright install --with-deps chromium

      - name: The page, built and opened
        run: npm run test:e2e

      - name: The prose, and the frozen references
        # tests/run.py, which needs no compiler here. Python is standard
        # library only.
        run: python tests/run.py

  build:
    needs: test
    # Pull requests are tested but never published.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci

      - name: The install really is what package.json pins
        # This job installs afresh, so it is the lockfile disagreeing with
        # package.json that would fire here rather than a stale node_modules.
        # Cheap, and this is the job whose output people actually receive.
        run: npm run preflight

      - name: Build
        # A project site is served from /<repo>/, so the bundle needs that
        # base. Derived from the repository name, so it follows a rename for
        # free - which package.json's build:pages and playwright.config.ts's
        # BASE do not, and both of those fail silently. A build with no base at
        # all renders an empty body with no error anywhere.
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
        run: npm run build

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
